# Bootstrap the compiler from the committed seed and prove it reaches a fixed
# point, then run the test suite against the compiler that produced it.
#
# The fixpoint check is the important one and it is cheap: a compiler that does
# not reproduce its own IR is mid-migration, and freezing that state is how a
# self-hosted toolchain quietly diverges from itself. Building from the *seed*
# rather than from an installed binary also verifies the thing a new contributor
# actually does on a fresh checkout.
#
# This runs on every push because several regressions during development were
# caught only by running the full loop -- the suite alone was green while `for`
# with a string literal was completely broken.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Kept in step with REQUIRED_MAJOR in tools/setup_llvm.py and
# PRISMIO_LLVM_EXPECTED_MAJOR in the runtime. The C API is stable within a major
# and not across them, so "some LLVM" is not good enough.
env:
  LLVM_MAJOR: "22"

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The set of runtime sources is written down in six places -- two tables in
      # build_driver.c, the embedding generator, both bootstrap scripts and both
      # packaging scripts. They had already drifted once, silently. Checked first
      # because it costs nothing and a mismatch makes everything below misleading.
      - name: Check the toolchain source lists agree
        run: python tools/check_source_lists.py

      - name: Check formatting and lint
        run: |
          python tools/format_sources.py --check
          python tools/lint.py

      # Install LLVM the way each platform actually ships it, *before* asking
      # setup_llvm.py for one -- it prefers a usable local install and only
      # downloads as a fallback.
      #
      # The fallback does not work on these two, which the matrix established on
      # 2026-08-29 rather than anyone assuming it: LLVM 22's `LLVM-<ver>-<OS>-
      # <ARCH>.tar.xz` extracts fine and then has no `llvm-c/Core.h` or shared
      # link library, so a downloaded release cannot satisfy the C API
      # dependency at all. Windows is unaffected -- it uses the
      # `clang+llvm-<triple>` package, which does carry them.
      #
      # This also fixes the *other* half of the same problem: it puts one LLVM
      # on PATH for both ends of the build, rather than linking the provisioned
      # LLVM-C and shelling out to whatever `clang` the image happened to ship.
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@${{ env.LLVM_MAJOR }} || brew install llvm
          echo "$(brew --prefix llvm@${{ env.LLVM_MAJOR }} 2>/dev/null || brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ env.LLVM_MAJOR }}
          sudo apt-get install -y "llvm-${{ env.LLVM_MAJOR }}-dev" "libclang-${{ env.LLVM_MAJOR }}-dev"
          echo "/usr/lib/llvm-${{ env.LLVM_MAJOR }}/bin" >> "$GITHUB_PATH"

      # Pinned to one LLVM major; setup_llvm.py rejects anything else rather
      # than adopting it, because the C API is not stable across majors.
      - name: Provision LLVM
        run: python tools/setup_llvm.py
        env:
          # The API query is rate-limited per IP when unauthenticated, and a
          # hosted runner shares its IP. Without this it returns 403 on two of
          # the three platforms at once and reads like a missing release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Put the LLVM we just provisioned ahead of whatever the image ships.
      #
      # The compiler links the provisioned LLVM-C (through
      # third_party/llvm-paths.json) but the native build step shells out to a
      # bare `clang` from PATH, so the two can be different versions -- and on
      # windows-latest they were. LLVM 22 writes
      # `memory(..., target_mem0: none, target_mem1: none)` into the curated
      # merge, and the image's older clang rejects it with "expected memory
      # location (argmem, inaccessiblemem)", failing every test in the suite.
      # One LLVM has to be on both ends of that round trip.
      - name: Put the provisioned LLVM on PATH
        shell: bash
        run: python -c "import json;print(json.load(open('third_party/llvm-paths.json'))['bin'])" >> "$GITHUB_PATH"


      - name: Bootstrap from the seed
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File tools/bootstrap.ps1 -Seed bootstrap/prismio-seed.ll -Out build/gen0.exe
            pwsh -File tools/bootstrap.ps1 -Compiler build/gen0.exe -Out build/gen1.exe
            pwsh -File tools/bootstrap.ps1 -Compiler build/gen1.exe -Out build/gen2.exe
          else
            tools/bootstrap.sh --seed --out build/gen0
            tools/bootstrap.sh --compiler build/gen0 --out build/gen1
            tools/bootstrap.sh --compiler build/gen1 --out build/gen2
          fi

      # gen1 and gen2 must agree on the IR they produce for the compiler. gen0
      # is excluded: it was built from the seed, which may predate the current
      # sources, so only the generations built from this tree are compared.
      - name: Verify the fixpoint
        shell: bash
        run: |
          set -e
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          "build/gen1$EXT" build src/main.psm -o build/a.ll
          "build/gen2$EXT" build src/main.psm -o build/b.ll
          test -s build/a.ll && test -s build/b.ll
          cmp build/a.ll build/b.ll && echo "fixpoint reached"

      - name: Run the test suite
        shell: bash
        run: |
          set -e
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          cd tests
          # `inline_runtime_default` requires the curated-module merge marker,
          # then proves PRISMIO_INLINE_RUNTIME=0 avoids it. Keep it in this
          # matrix: a successful fail-open build is not portability evidence.
          PRISMIO="../build/gen2$EXT" python test_runner.py

      # The allocation ledger proves Prismio's inferred releases balance; it
      # cannot detect a balanced release that happens before the last read.
      # These programs are therefore linked against the runtime with ASan.
      - name: Run AddressSanitizer smoke suite
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/sanitizer_smoke.py --compiler build/gen2

      # Build the maintained three-language matrix and validate every supported
      # workload checksum. Hosted-runner timings are recorded, not gated.
      - name: Run benchmark validation smoke
        if: runner.os == 'Linux'
        shell: bash
        run: python benchmarks/run.py --compiler build/gen2 --runs 1 --output build/ci-benchmark.json

      # The AIF engine exists twice on purpose: once in the compiler and once as
      # aif/prototype/aif.py, sharing no code. A transfer function that is subtly
      # wrong produces a silently wrong tier rather than a crash, so the two
      # agreeing is the only real check on either -- and it is worth nothing
      # unless something notices when they stop.
      - name: AIF engine agrees with the oracle
        shell: bash
        run: |
          set -e
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          python tools/aif_differential.py --compiler "build/gen2$EXT"

      # A seed that can no longer build the tree strands anyone starting from a
      # fresh checkout, so it is checked rather than assumed.
      - name: Check the committed seed is still usable
        shell: bash
        run: |
          set -e
          grep -q '^target ' bootstrap/prismio-seed.ll && {
            echo "seed carries a target directive; it must stay target-neutral"; exit 1; }
          echo "seed is target-neutral"

      # Everything above proves the compiler in `build/`. **Nothing above proves
      # the thing a user installs**, and the two differ in the way that matters:
      # an uninstalled compiler falls back to the runtime sources embedded in its
      # own binary, silently, so a packaging mistake looks like success. That is
      # the fallback `verify_separation` exists to catch, and it had never run on
      # Windows or Linux -- packaging was a local step before v0.1.
      - name: Package the toolchain
        shell: bash
        run: |
          set -e
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          python tools/package.py --compiler "build/gen2$EXT" --out dist/Prismio

      # The separation this asserts is not cosmetic: a compiled program links
      # runtime.a only, so no `ir_*` backend symbol may reach a user binary. It
      # also proves the installed libraries are the ones actually used rather
      # than the embedded fallback.
      - name: Verify the packaged toolchain
        shell: bash
        run: |
          set -e
          python tools/verify_separation.py --dist dist/Prismio

      # A *clean* environment: the packaged compiler, moved away from the
      # checkout, building a program that is not in the checkout either. This is
      # the smoke test a release artifact has to pass, and running it from the
      # repository root would let the tree supply what the package forgot.
      - name: Smoke-test the package outside the checkout
        shell: bash
        run: |
          set -e
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          CLEAN="$(mktemp -d)"
          cp -R dist/Prismio "$CLEAN/toolchain"
          cat > "$CLEAN/smoke.psm" <<'PSM'
          import std.io
          import std.list
          import std.map
          import std.option

          struct Note { id: Int }

          fn main() -> Int {
              let mut ids: List<Int> = list_new()
              list_push(ids, 3)
              list_push(ids, 1)
              list_push(ids, 2)
              ids.sort()

              let m: Map<Int, Int> = mapNew<Int, Int>()
              mapSet(m, list_get(ids, 0), 10)

              let c: Channel<Note> = chan_new(2)
              chan_send(c, Note { id: 7 })
              chan_close(c)
              let taken = chan_recv(c)
              let mut got = 0
              if (taken != none) {
                  let note = expect(taken)
                  got = note.id
              }
              chan_free(c)

              println(list_get(ids, 0) + mapGetOr(m, 1, 0) + got)
              return 0
          }
          PSM
          cd "$CLEAN"
          "./toolchain/bin/prismio$EXT" build smoke.psm -o smoke$EXT \
            || "./toolchain/prismio$EXT" build smoke.psm -o smoke$EXT
          OUT="$(./smoke$EXT)"
          echo "smoke output: $OUT"
          [ "$OUT" = "18" ] || { echo "expected 18"; exit 1; }
